{% extends "base.html" %}{% block content %}<h1>Contacts</h1><div class="grid"><div class="panel"><h2>CSV Import</h2><p class="muted">Columns: name, phone, group</p><form method="post" enctype="multipart/form-data" class="form"><input type="file" name="file" accept=".csv" required><button class="btn">Import</button></form></div><div class="panel"><h2>Example</h2><pre>name,phone,group\nRahul,919876543210,GGV\nPriya,919812345678,MBBS</pre></div></div><br><div class="panel"><table class="table"><tr><th>Name</th><th>Phone</th><th>Group</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.group_name}}</td></tr>{% else %}<tr><td colspan="3">No contacts.</td></tr>{% endfor %}</table></div>{% endblock %}
