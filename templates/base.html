<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deepak's CRM</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f7fb;
    color:#172033
}

.nav{
    background:#123a63;
    color:#fff;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center
}

.brand{
    font-size:22px;
    font-weight:700
}

.nav a{
    color:#fff;
    text-decoration:none;
    margin-left:18px
}

.nav a:hover{
    text-decoration:underline
}

.wrap{
    max-width:1100px;
    margin:28px auto;
    padding:0 18px
}

.cards,
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px
}

.grid{
    grid-template-columns:1fr 1fr
}

.card,
.panel{
    background:#fff;
    border-radius:14px;
    padding:22px;
    box-shadow:0 3px 14px #0001
}

.num{
    font-size:32px;
    font-weight:700
}

.btn{
    background:#1769aa;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer
}

.table{
    width:100%;
    border-collapse:collapse
}

.table th,
.table td{
    padding:11px;
    border-bottom:1px solid #e8ebf0;
    text-align:left
}

.form input,
.form textarea,
.form select{
    width:100%;
    box-sizing:border-box;
    padding:11px;
    margin:6px 0 14px;
    border:1px solid #ccd3dd;
    border-radius:8px
}

.form textarea{
    min-height:130px
}

.flash{
    background:#e9f5ff;
    padding:12px;
    border-radius:8px;
    margin-bottom:16px
}

.muted{
    color:#697586
}

@media(max-width:700px){

    .cards,
    .grid{
        grid-template-columns:1fr
    }

    .nav{
        display:block
    }

    .nav a{
        display:inline-block;
        margin:10px 10px 0 0
    }
}
</style>
</head>

<body>

<div class="nav">

    <div class="brand">
        📱 Deepak's CRM
    </div>

    <div>

        <a href="/">Dashboard</a>

        <a href="/contacts">Contacts</a>

        <a href="/campaigns">Campaigns</a>

        <a href="/messages">Messages</a>

        <a href="/incoming">Incoming</a>

        <a href="/settings">Settings</a>

    </div>

</div>

<div class="wrap">

{% with messages=get_flashed_messages() %}

    {% for m in messages %}

        <div class="flash">
            {{m}}
        </div>

    {% endfor %}

{% endwith %}

{% block content %}

{% endblock %}

</div>

</body>
</html>
