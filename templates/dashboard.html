{% extends "base.html" %}{% block content %}<h1>Dashboard</h1><div class="cards"><div class="card">Contacts<div class="num">{{contacts}}</div></div><div class="card">Campaigns<div class="num">{{campaigns}}</div></div><div class="card">WhatsApp API<div class="num">Setup</div></div></div><br><div class="panel"><h2>Recent Campaigns</h2><table class="table"><tr><th>Name</th><th>Group</th><th>Status</th></tr>{% for r in recent %}<tr><td>{{r.name}}</td><td>{{r.group_name or 'All'}}</td><td>{{r.status}}</td></tr>{% else %}<tr><td colspan="3">No campaigns.</td></tr>{% endfor %}</table></div>{% endblock %}
