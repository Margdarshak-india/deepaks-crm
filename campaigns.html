{% extends "base.html" %}{% block content %}<h1>WhatsApp Campaigns</h1><div class="panel"><form method="post" class="form"><label>Campaign Name</label><input name="name" required><label>Group</label><select name="group_name"><option value="">All contacts</option>{% for g in groups %}<option>{{g}}</option>{% endfor %}</select><label>Message</label><textarea name="message" placeholder="Hello {{name}}, ..." required></textarea><button class="btn">Save Campaign</button></form></div><br><div class="panel"><table class="table"><tr><th>Name</th><th>Group</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.group_name or 'All'}}</td><td>{{r.status}}</td><td><form method="post" action="/campaign/{{r.id}}/send"><button class="btn">Send</button></form></td></tr>{% else %}<tr><td colspan="4">No campaigns.</td></tr>{% endfor %}</table></div>{% endblock %}
